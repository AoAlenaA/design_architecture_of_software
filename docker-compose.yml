services:
  db:
    image: postgres:15
    container_name: analytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: analytics_api
    ports:
      - "8080:8080"
    depends_on:
      - db

  client:
    build: ./frontend
    container_name: analytics_client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data: